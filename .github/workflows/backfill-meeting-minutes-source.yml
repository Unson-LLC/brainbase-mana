name: Slack原文から議事録を復旧

on:
  workflow_dispatch:
    inputs:
      message_ts:
        description: 元投稿のSlack timestamp
        required: true
        type: string
      file_id:
        description: 元投稿の文字起こしfile ID
        required: true
        type: string
      source_app_id:
        description: 元投稿を認証する送信元（Zapier原文または管理者の手動復旧投稿）
        required: true
        default: A024R9PQM
        type: choice
        options:
          - A024R9PQM
          - A0BPM2J33SN
      reason:
        description: 復旧理由（監査用）
        required: true
        type: string
      recovery_revision:
        description: 既存の失敗runを再作成する場合だけ指定する復旧番号（1-999）
        required: false
        type: string

concurrency:
  group: meeting-minutes-source-backfill-${{ inputs.message_ts }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: 元投稿を照合して通常処理へ戻す
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://unson-business-mana-runtime.unson.workers.dev
    steps:
      - name: 入力を検証して復旧する
        shell: bash
        env:
          MESSAGE_TS: ${{ inputs.message_ts }}
          FILE_ID: ${{ inputs.file_id }}
          SOURCE_APP_ID: ${{ inputs.source_app_id }}
          BACKFILL_REASON: ${{ inputs.reason }}
          RECOVERY_REVISION: ${{ inputs.recovery_revision }}
          SANDBOX_PROBE_TOKEN: ${{ secrets.SANDBOX_PROBE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$MESSAGE_TS" =~ ^[0-9]{10}\.[0-9]{6}$ ]]
          [[ "$FILE_ID" =~ ^F[A-Z0-9]{8,31}$ ]]
          [[ "$SOURCE_APP_ID" == 'A024R9PQM' || "$SOURCE_APP_ID" == 'A0BPM2J33SN' ]]
          test -n "$BACKFILL_REASON"
          if [[ -n "$RECOVERY_REVISION" ]]; then
            [[ "$RECOVERY_REVISION" =~ ^[1-9][0-9]{0,2}$ ]]
          fi
          test -n "$SANDBOX_PROBE_TOKEN"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          payload="$(jq -cn \
            --arg tenantId 'ten_01M0HMA228ES64N4TFX846V8T8' \
            --arg workspaceId 'T0882T8N9UH' \
            --arg channelId 'C0BKTFQ9V38' \
            --arg messageTs "$MESSAGE_TS" \
            --arg fileId "$FILE_ID" \
            --arg sourceAppId "$SOURCE_APP_ID" \
            --arg recoveryRevision "$RECOVERY_REVISION" \
            '{tenantId:$tenantId,workspaceId:$workspaceId,channelId:$channelId,messageTs:$messageTs,fileId:$fileId,sourceAppId:$sourceAppId}
             + (if $recoveryRevision == "" then {} else {recoveryRevision:($recoveryRevision | tonumber)} end)')"
          status="$(curl -sS --connect-timeout 15 --max-time 45 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $SANDBOX_PROBE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://unson-business-mana-runtime.unson.workers.dev/admin/meeting-minutes/backfill')"

          if [[ "$status" != "200" ]]; then
            error_code="$(jq -r '.error // "meeting_minutes_backfill_unknown_failure"' "$response_file" 2>/dev/null || printf '%s' 'meeting_minutes_backfill_invalid_response')"
            if [[ ! "$error_code" =~ ^(meeting_minutes|company_authority|tenant_context|worker_ingress)_[a-z0-9_]{3,120}$ ]]; then
              error_code='meeting_minutes_backfill_unknown_failure'
            fi
            echo "復旧API失敗: HTTP $status / $error_code" >&2
            exit 1
          fi
          jq -e --arg status "$status" \
            '$status == "200"
             and (.runId | type == "string" and length > 0)
             and (.status | type == "string")
             and (.enqueued | type == "boolean")' "$response_file" >/dev/null

          safe_result="$(jq --arg messageTs "$MESSAGE_TS" \
            '{runId,messageTs:$messageTs,status,enqueued,created}' "$response_file")"
          printf '%s\n' "$safe_result"
          {
            echo '## Slack原文からの議事録復旧'
            printf '%s\n' "- 元投稿: \`$MESSAGE_TS\`"
            printf '%s\n' "- file ID: \`$FILE_ID\`"
            printf '%s\n' "- 送信元app ID: \`$SOURCE_APP_ID\`"
            printf '%s\n' "- 理由: $BACKFILL_REASON"
            if [[ -n "$RECOVERY_REVISION" ]]; then
              printf '%s\n' "- 復旧リビジョン: \`$RECOVERY_REVISION\`"
            fi
            echo '- API応答（安全な項目のみ）:'
            echo '```json'
            echo "$safe_result"
            echo '```'
            echo '- この結果だけでは議事録生成完了とは判定しない。Slackの元スレッドを別途読み戻す。'
          } >> "$GITHUB_STEP_SUMMARY"
